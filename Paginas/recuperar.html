<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña — Listaro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<main class="split">
  <section class="split-izq">
    <a class="marca" href="../index.html"><span class="marca-punto"></span> Listaro</a>
    <div>
      <h1>Recupera el <span class="naranja">control.</span></h1>
      <p>Te enviaremos un enlace seguro para crear una nueva contraseña.</p>
    </div>
    <p class="split-pie">Inventario por edificio, habitación y artículo.</p>
  </section>
  <section class="split-der">
    <div class="formulario">
      <h2>Restablecer contraseña</h2>
      <p class="sub">Escribe el correo de tu cuenta para continuar.</p>
      <p class="error" id="error-recuperar" hidden></p>
      <p class="demo-hint" id="mensaje-recuperar" hidden></p>
      <form id="form-recuperar" novalidate>
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="email" placeholder="tu@correo.com" required>
        <button class="btn btn-naranja btn-bloque" type="submit">Buscar cuenta</button>
      </form>
      <form id="form-restablecer" novalidate hidden>
        <label for="codigo">Código de demostración</label>
        <input id="codigo" name="codigo" type="text" value="LISTARO-DEMO" required>
        <label for="clave">Nueva contraseña</label>
        <input id="clave" name="clave" type="password" autocomplete="new-password" required>
        <label for="confirmar">Repite la contraseña</label>
        <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required>
        <button class="btn btn-naranja btn-bloque" type="submit">Guardar contraseña</button>
      </form>
      <p class="sub"><a class="enlace-naranja" href="login.html">Volver a iniciar sesión</a></p>
    </div>
  </section>
</main>
<div id="aviso" class="aviso" role="status" aria-live="polite"></div>
<script src="../js/datos.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
